<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1210" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Offline - Gochujang preview</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/pr-shell.css" />
  </head>
  <body>
    <main class="pr-shell" id="pr-main" tabindex="-1">
      <a class="pr-skip" href="#pr-content">Skip to content</a>
      <div class="pr-inner">
        <header class="pr-header">
          <a class="pr-brand" href="/" aria-label="Gochujang home">Gochujang</a>
        </header>
        <section class="pr-content" id="pr-content" aria-labelledby="offline-title">
          <p class="pr-kicker">Controlled preview</p>
          <h1 class="pr-h1" id="offline-title">You are offline.</h1>
          <p class="pr-p">
            This preview does not cache recipe drafts or food-safety guidance. Reconnect to load the current,
            reviewed version of the site.
          </p>
          <p class="pr-p"><a href="/">Try again</a></p>
        </section>
        <footer class="pr-footer">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/editorial-policy">Editorial policy</a>
        </footer>
      </div>
    </main>
  </body>
</html>
