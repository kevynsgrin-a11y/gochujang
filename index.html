    />
    <meta name="twitter:image" content="https://gochujang.net/og.png" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var k = 'gochujang-theme'
          var s = localStorage.getItem(k)
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var tc = document.querySelector('meta[name="theme-color"]')
          if (tc) tc.setAttribute('content', dark ? '#161210' : '#F5EFE6')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
