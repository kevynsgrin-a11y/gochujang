name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, build, verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs tsc, vite build, the prerenderer, and the build gate that asserts
      # per-route metadata, JSON-LD, the 404 page, and sitemap/route parity.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  a11y:
    name: Accessibility (axe + keyboard)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Installed here rather than as devDependencies so the Cloudflare Pages
      # production build never has to download a browser.
      - run: npm install --no-save playwright @axe-core/playwright
      # Browser binary only. `--with-deps` shells out to apt, which can block on
      # the runner's package lock for far longer than the test itself takes; the
      # ubuntu-latest image already carries the libraries Chromium needs.
      - run: npx playwright install chromium
      - run: node scripts/a11y.mjs
